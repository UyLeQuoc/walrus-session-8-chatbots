<!doctype html><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff}
  .fig{width:1600px;height:440px;background:#fff;color:#09090b;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:60px 70px;display:flex;flex-direction:column;justify-content:center}
  .track{position:relative;display:flex;align-items:flex-start;justify-content:space-between}
  .rail{position:absolute;left:8%;right:8%;top:19px;height:4px;background:#e4e4e7;border-radius:2px}
  /* Solid while the removed key was confirmed still working; dashed across the
     gap between the last accepted call and the first refusal, which is the part
     the measurement does not pin down. */
  .rail .live{position:absolute;left:0;width:64.9%;height:4px;background:#f59e0b;border-radius:2px}
  .rail .gap{position:absolute;left:64.9%;width:26.9%;height:4px;
    background:repeating-linear-gradient(90deg,#f59e0b 0 9px,transparent 9px 18px)}
  .pt{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:18px;
    text-align:center}
  .dot{width:42px;height:42px;border-radius:50%;background:#fff;border:4px solid #d4d4d8;z-index:1}
  .pt.warn .dot{border-color:#f59e0b}
  .pt.end .dot{border-color:#0d9488;background:#0d9488}
  .t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:44px;
    font-weight:700;letter-spacing:-.03em}
  .pt.warn .t{color:#b45309}
  .pt.end .t{color:#0f766e}
  .l{font-size:24px;line-height:1.35;color:#3f3f46;max-width:19ch;font-weight:500}
  .pt.end .l{font-weight:620;color:#09090b}
</style>
<div class="fig">
  <div class="track">
    <div class="rail"><div class="live"></div><div class="gap"></div></div>
    <div class="pt"><div class="dot"></div><div class="t">0s</div><div class="l">key removed on chain</div></div>
    <div class="pt"><div class="dot"></div><div class="t">3s</div><div class="l">chain stops listing it</div></div>
    <div class="pt warn"><div class="dot"></div><div class="t">15s</div><div class="l">relayer still accepts it</div></div>
    <div class="pt end"><div class="dot"></div><div class="t">32s</div><div class="l">401 — access over</div></div>
  </div>
</div>
