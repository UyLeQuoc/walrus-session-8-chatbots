<!doctype html><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff}
  .fig{width:1600px;height:480px;background:#fff;color:#09090b;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:56px 70px;display:flex;flex-direction:column;justify-content:center}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:18px;letter-spacing:.1em;text-transform:uppercase;color:#a1a1aa;
    font-weight:700;padding:0 24px 16px 0;border-bottom:2px solid #e4e4e7}
  th.n,td.n{text-align:center}
  td{padding:24px 24px 24px 0;border-bottom:1px solid #f4f4f5;font-size:25px;vertical-align:middle}
  td.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:23px;font-weight:600}
  td.c{font-variant-numeric:tabular-nums;color:#3f3f46}
  .pill{display:inline-block;border-radius:999px;padding:8px 20px;font-size:21px;font-weight:620}
  .ok{background:#f0fdfa;color:#0f766e;border:2px solid #99f6e4}
  .bad{background:#fef2f2;color:#b91c1c;border:2px solid #fecaca}
  .half{background:#fffbeb;color:#b45309;border:2px solid #fde68a}
  .dead{background:#f4f4f5;color:#71717a;border:2px solid #e4e4e7}
  tr.pick td{background:#fafafa}
  tr.pick td:first-child{box-shadow:inset 4px 0 0 #0d9488}
</style>
<div class="fig">
  <table>
    <tr><th>Model</th><th class="n">Facts recalled</th>
      <th class="n">Stored instruction obeyed</th><th class="n">Cost per run</th></tr>
    <tr class="pick"><td class="m">google/gemini-2.5-flash</td><td class="n">4/4, 3/4</td>
      <td class="n"><span class="pill ok">both runs</span></td><td class="n c">$0.0035</td></tr>
    <tr><td class="m">qwen/qwen3.7-flash</td><td class="n">4/4, 4/4</td>
      <td class="n"><span class="pill half">1 of 2</span></td><td class="n c">$0.0010</td></tr>
    <tr><td class="m">deepseek/deepseek-v4-flash</td><td class="n">4/4, 4/4</td>
      <td class="n"><span class="pill bad">neither run</span></td><td class="n c">$0.0015</td></tr>
    <tr><td class="m">qwen/qwen3-235b-a22b</td><td class="n">—</td>
      <td class="n"><span class="pill dead">no output</span></td><td class="n c">$0.0002</td></tr>
  </table>
</div>
