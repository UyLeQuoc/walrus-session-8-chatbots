<!doctype html><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff}
  .fig{width:1600px;height:720px;background:#fff;color:#09090b;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:70px 70px;display:flex;flex-direction:column;justify-content:center;gap:76px}
  .row{display:flex;align-items:center}
  .tag{flex:0 0 130px;font-size:22px;letter-spacing:.14em;text-transform:uppercase;
    font-weight:700;color:#0d9488}
  .tag.r{color:#7c3aed}
  .box{border:2px solid #e4e4e7;border-radius:16px;padding:24px 30px;background:#fff;
    font-size:26px;font-weight:600;letter-spacing:-.015em;white-space:nowrap}
  .box.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:24px;
    font-weight:500;background:#fafafa;color:#3f3f46}
  .box.hot{border-color:#0d9488;background:#f0fdfa;color:#0f766e}
  .box.hot2{border-color:#7c3aed;background:#faf5ff;color:#6d28d9}
  .arrow{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:7px;
    padding:0 24px;color:#d4d4d8}
  .arrow .a{font-size:34px;line-height:1}
  .arrow .t{font-size:19px;color:#0d9488;font-weight:700;letter-spacing:.02em}
  .split{display:flex;flex-direction:column;gap:14px}
  .sep{height:2px;background:#f4f4f5}
</style>
<div class="fig">
  <div class="row">
    <div class="tag">Write</div>
    <div class="box mono">remember("prefers Vietnamese")</div>
    <div class="arrow"><div class="a">→</div></div>
    <div class="box hot">embed · encrypt</div>
    <div class="arrow"><div class="a">→</div><div class="t">~24s</div></div>
    <div class="split">
      <div class="box">encrypted blob on Walrus</div>
      <div class="box">vector in the index</div>
    </div>
  </div>

  <div class="sep"></div>

  <div class="row">
    <div class="tag r">Read</div>
    <div class="box mono">recall("what language?")</div>
    <div class="arrow"><div class="a">→</div></div>
    <div class="box hot2">nearest vectors</div>
    <div class="arrow"><div class="a">→</div></div>
    <div class="box">text + distance, ranked</div>
  </div>
</div>
