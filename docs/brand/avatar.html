<!doctype html><meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; background:#0a0a0a; }
  .avatar { width:640px; height:640px; background:#0a0a0a; position:relative; overflow:hidden;
            display:flex; align-items:center; justify-content:center; }
  .glow { position:absolute; inset:0;
          background:radial-gradient(circle at 50% 46%, rgba(45,212,191,.28), rgba(45,212,191,.06) 42%, transparent 62%); }
  .avatar img { width:300px; height:auto; position:relative; transform:translateY(-6px); }
</style>
<div class="avatar"><div class="glow"></div><img src="mark-white.png" alt=""></div>
